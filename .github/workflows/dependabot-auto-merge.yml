name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Security checks]
    types: [completed]
  schedule:
    # Retry when Vercel finishes after Security checks, or a check is rerun.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check eligibility without merging
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      # Only trusted default-branch code runs with the merge token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Merge verified Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: node scripts/dependabot-auto-merge.mjs $DRY_RUN
