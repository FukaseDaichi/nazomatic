name: X Growth PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - labeled
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: x-growth-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: contains(github.event.pull_request.labels.*.name, 'x-growth-experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run X posting tests
        run: npm run test:x-browser-posting
      - name: Build
        run: npm run build
